services:
  service:
    environment:
      PUBLIC_URL: https://collabs.miliastra.dev
      # Reverse proxy stuff
      TRUST_FORWARDED_FOR: "1"
  proxy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [service]
  backup:
    image: postgres:17
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      PGHOST: postgres
      PGUSER: collab
      PGDATABASE: collab
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes: ["./backups:/backups"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        while true; do
          # Sleep until the next BACKUP_HOUR:00 (container time zone TZ).
          now=$$(date +%s)
          next=$$(date -d "today $${BACKUP_HOUR}:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$(date -d "tomorrow $${BACKUP_HOUR}:00" +%s)
          sleep $$((next - now))
          file=/backups/collab-$$(date +%Y-%m-%d).dump
          if pg_dump --format=custom --file="$$file.partial" && mv "$$file.partial" "$$file"; then
            echo "backup written: $$file"
          else
            rm -f "$$file.partial"
            echo "backup FAILED" >&2
          fi
          find /backups -name 'collab-*.dump' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
        done
volumes:
  caddy-data:
  caddy-config:
